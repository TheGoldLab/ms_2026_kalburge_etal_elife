[project]
name = "pigeon-analysis"
version = "0.1.0"
description = "Analysis code for the Pigeon decision-making task (Kalburge et al.)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pigeon"   # import name; the distribution is pigeon-analysis

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120   # the length the existing code is written to

[tool.pytest.ini_options]
markers = ["slow: real stopping-model fits (~15 s to ~30 min each); run with `uv run pytest -m slow`"]
addopts = "-m 'not slow'"   # default run skips them; `-m slow` runs only them, `-m ""` runs everything
