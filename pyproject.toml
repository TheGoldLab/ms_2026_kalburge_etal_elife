[project]
name = "pigeon-analysis"
version = "0.1.0"
description = "Analysis code for the Pigeon decision-making task (Kalburge et al.)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120   # the length the existing code is written to

[tool.pytest.ini_options]
pythonpath = ["."]   # tests import the pigeon package from the project root

[tool.ruff.lint.per-file-ignores]
"pigeon/pathDefaults.py" = ["N999"]   # module name kept: every notebook imports pigeon.pathDefaults
